<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#171B5A"/>

  <!-- Puzzle pieces (simplified arcs matching the logo palette) -->
  <!-- Top-left: Red -->
  <path d="M32 32 L10 10 Q32 4 32 32Z" fill="#C92734"/>
  <!-- Top-right: Orange -->
  <path d="M32 32 L54 10 Q60 32 32 32Z" fill="#C95B2D"/>
  <!-- Right: Yellow -->
  <path d="M32 32 L54 54 Q32 60 32 32Z" fill="#E3C11B"/>
  <!-- Bottom: Green -->
  <path d="M32 32 L10 54 Q4 32 32 32Z" fill="#1FA34A"/>
  <!-- Left: Purple -->
  <path d="M32 32 L10 10 Q4 32 10 54Z" fill="#4E347F"/>
  <!-- Extra slice: Magenta -->
  <path d="M32 32 L54 10 L54 54Z" fill="#B7176A" opacity="0.7"/>

  <!-- Inner navy circle -->
  <circle cx="32" cy="32" r="18" fill="#171B5A"/>

  <!-- Hummingbird — simplified white silhouette -->
  <g transform="translate(32,32)" fill="#FFFFFF">
    <!-- Body -->
    <ellipse cx="0" cy="1" rx="5" ry="8" transform="rotate(-30)"/>
    <!-- Wing upper -->
    <ellipse cx="-6" cy="-5" rx="9" ry="3.5" transform="rotate(-20)" opacity="0.95"/>
    <!-- Wing lower -->
    <ellipse cx="-4" cy="2" rx="7" ry="2.5" transform="rotate(10)" opacity="0.75"/>
    <!-- Head -->
    <circle cx="3" cy="-7" r="3.5"/>
    <!-- Beak -->
    <line x1="5" y1="-9" x2="12" y2="-13" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="4" cy="-8" r="0.8" fill="#171B5A"/>
  </g>
</svg>
